spring.application.name=feira
server.port=8080

# Lê o arquivo .env da pasta backend, se existir (é onde ficam os dados do Supabase).
spring.config.import=optional:file:.env[.properties]

# Banco de cada pessoa na própria máquina: um arquivo H2 em backend/dados. Não precisa instalar nada.
spring.datasource.url=jdbc:h2:file:./dados/feira;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Para espiar as tabelas no navegador: http://localhost:8080/h2-console (JDBC URL igual à de cima).
spring.h2.console.enabled=true

# Regras da feira
feira.pin=${FEIRA_PIN:feira}
feira.fichas-por-ciclo=2
feira.pontos-por-ficha=5
