# Perfil "telao": o back-end também entrega o front já compilado, tudo na porta 8080.
# É assim que os outros computadores abrem a feira. Quem liga este perfil é o scripts/telao.mjs.
spring.web.resources.static-locations=file:./dados/telao/frontend/
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
