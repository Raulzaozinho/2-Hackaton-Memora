# Confere, a cada push e a cada PR, que o projeto compila e que os testes passam.
name: Conferir

on:
  push:
    branches: [main, 'equipe-*']
  pull_request:

jobs:
  backend:
    name: Back-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes do back-end
        working-directory: backend
        run: bash ./mvnw -B test

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Testes do front-end
        working-directory: frontend
        run: npx ng test --watch=false
      - name: Compilar o front-end
        working-directory: frontend
        run: npx ng build
      - name: Testar as entregas do telão
        run: node --test scripts/telao.test.mjs scripts/piloto.test.mjs
